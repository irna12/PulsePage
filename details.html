<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Details Card</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module" src="firebasedetails.js"></script>  
    <style>
        /* 1. RESET & BASE STYLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #e0d9cf; /* Warna latar belakang luar */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 2. CARD CONTAINER */
        .book-card {
            background-color: #fffaf4; /* Warna krem lembut sesuai gambar */
            width: 100%;
            max-width: 550px;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid #f3ebe1;
        }

        /* 3. HEADER SECTION */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            color: #2c2c2c;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .more-btn {
            cursor: pointer;
            color: #666;
            padding: 4px;
        }

        /* 4. MAIN CONTENT (Cover + Details) */
        .main-content {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        /* Cover Buku */
        .book-cover {
            width: 100%;
            height: 200px;
            background-color: #0d1e33; /* Warna gelap cover */
            border-radius: 8px;
            color: white;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            position: relative;
        }

        .cover-mini-dots {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 12px;
            opacity: 0.7;
        }

        .cover-title {
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
            line-height: 1.2;
        }

        .cover-illustration {
            text-align: center;
            font-size: 24px;
            margin: 10px 0;
        }

        .cover-author {
            font-size: 10px;
            text-align: center;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        /* Detail Informasi di Kanan */
        .book-info {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .book-title {
            font-size: 20px;
            color: #1a1a1a;
            margin-bottom: 4px;
            font-family: 'Georgia', serif; /* Agar terkesan elegan seperti di foto */
        }

        .book-author {
            font-size: 14px;
            color: #555;
            margin-bottom: 6px;
        }

        .book-genre {
            font-size: 12px;
            color: #888;
            margin-bottom: 12px;
        }

        .rating-container {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #666;
            margin-bottom: 16px;
        }

        .stars {
            color: #f2a93b; /* Warna bintang oranye/emas */
        }

        /* 5. PROGRESS BAR */
        .progress-section {
            margin-top: auto; /* Mendorong progress ke bawah info */
        }

        .progress-label {
            font-size: 14px;
            font-weight: 600;
            color: #2c2c2c;
            margin-bottom: 8px;
        }

        .bar-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .progress-bar-bg {
            flex: 1;
            background-color: #ede3d7;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            background-color: #614028; /* Warna cokelat sesuai gambar */
            height: 100%;
            width: 60%; /* Ini nilai 60% nya */
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .progress-percent {
            font-size: 14px;
            font-weight: bold;
            color: #2c2c2c;
        }

        .page-count {
            text-align: right;
            font-size: 11px;
            color: #777;
            margin-top: 4px;
        }

        /* 6. METADATA GRID (Status, Started On) */
        .meta-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 16px 0;
            border-bottom: 1px solid #f3ebe1;
            margin-bottom: 16px;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .meta-label {
            font-size: 12px;
            color: #777;
        }

        .meta-value {
            font-size: 13px;
            font-weight: 600;
            color: #2c2c2c;
        }

        /* 7. NOTES SECTION */
        .notes-section {
            margin-bottom: 24px;
        }

        .notes-title {
            font-size: 14px;
            font-weight: 600;
            color: #2c2c2c;
            margin-bottom: 6px;
        }

        .notes-content {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }

        /* 8. BUTTONS ACTION */
        .action-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.8;
        }

        .btn-edit {
            background-color: transparent;
            border: 1px solid #d3c4b4;
            color: #444;
        }

        .btn-delete {
            background-color: #fcdbd9; /* Merah muda lembut */
            color: #d9383a; /* Tulisan merah */
        }

        /* RESPONSIF UNTUK LAYAR KECIL (HP) */
        @media (max-width: 480px) {
            .main-content {
                grid-template-columns: 1fr;
                justify-items: center;
            }
            .book-cover {
                width: 140px;
            }
            .book-info {
                text-align: center;
                align-items: center;
            }
            .bar-container {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="book-card">
        
        <div class="card-header">
            <div class="back-btn" onclick="goBack()">
                <i class="fa-solid fa-arrow-left"></i> Book Details
            </div>
        </div>

        <div class="main-content">
            <div class="book-cover">
                <div class="cover-mini-dots"><i class="fa-solid fa-ellipsis-vertical"></i></div>
                <div id="title" class="cover-title"></div>
                <div class="cover-illustration">🏢</div>
                <div id="author" class="cover-author"></div>
            </div>

            <div class="book-info">
                <h2 id="title2" class="book-title"></h2>
                <div id="author2" class="book-author"></div>
                <div id="genre" class="book-genre"></div>
                
                <div class="rating-container">
                    <div class="stars">
                        <i id='star1'></i>
                        <i id='star2'></i>
                        <i id='star3'></i>
                        <i id='star4'></i>
                        <i id='star5'></i>
                        <!--<i id='star2' class="fa-solid fa-star"></i>
                        <i id='star3' class="fa-solid fa-star"></i>
                        <i id='star4' class="fa-solid fa-star"></i>
                        <i id='star5' class="fa-solid fa-star"></i>-->
                    </div>
                    <span id="star"></span>
                </div>

                <div class="progress-section">
                    <div class="progress-label">Reading Progress</div>
                    <div class="bar-container">
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" id="progressBar" style.width = '0'></div>
                        </div>
                        <div class="progress-percent" id="progressT"></div>
                    </div>
                    <div id='pCount' class="page-count"></div>
                </div>
            </div>
        </div>

        <div class="meta-grid">
            <div class="meta-item">
                <span class="meta-label">Status</span>
                <span id='status' class="meta-value" style="color: #4a5568;"></span>
            </div>
            <div class="meta-item">
                <span id='startEnd' class="meta-label"></span>
                <span id='date' class="meta-value"></span>
            </div>
            <div class="meta-item" style="text-align: right;">
                <span class="meta-label">Progress</span>
                <span id="progress2" class="meta-value">0%</span>
            </div>
        </div>

        <div class="notes-section">
            <h3 class="notes-title">Notes</h3>
            <p id='note' class="notes-content">
                
            </p>
        </div>

        <div class="action-buttons">
            <button class="btn btn-update" id="updatebook">Update</button>

            <a id="editbook" class="btn btn-edit">Edit Book</a>
            <!--test by nadiah-->
            <button class="btn btn-delete" id="delbook">Delete Book</button>
        </div>

        <script>
            function goBack() {
                window.location.href = "/library.html";
            }
        </script>

    </div>
</body>
</html>
