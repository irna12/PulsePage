<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Home Page</title>
    <link rel="stylesheet" href="library.css">
    
    <script type="module" src="firebaseloggedin.js"></script>

</head>
<body>
    <div id="page-content" style="display: none;"></div>

    </div>
    <nav class="sidebar close">
        <header>
            <div class="image-text">
                <span class="image">
                    <img src="books.png" alt="logo">
                </span>

                <div class="text header-text">
                    <span class="name">PulsePage</span>
                    <span class="profession">Book Tracker</span>
                </div>
            </div>
            <i class="fa-solid fa-caret-right toggle"></i>
        </header>
        <div class="menu-bar">
            <div class="menu">

                <ul class="menu-links">
                    <li class="nav-link">
                        <a href="homepage.html">
                            <i class="fa-solid fa-house icon"></i>
                            <span class="text nav-text">Dashboard</span>
                        </a>
                    </li>
                    <li class="nav-link">
                        <a href="library.html">
                            <i class="fa-solid fa-book icon"></i>
                            <span class="text nav-text">Library</span>
                        </a>
                    </li>
                </ul>
            </div>
            <div class="bottom-content">
                <li class="nav-link">
                    <a type="btn" id="logout">
                        <i class="fa-solid fa-door-open icon"></i>
                        <span class="text nav-text">Logout</span>
                    </a>
                </li>

                <li class="mode">
                    <div class="sun-moon">
                        <i class="fa-solid fa-sun icon sun"></i>
                        <i class="fa-solid fa-moon icon moon"></i>
                    </div>

                    <span class="mode-text text">Dark Mode</span>

                    <div class="toggle-switch">
                        <span class="switch"></span>
                    </div>
                </li>
            </div>
        </div>
    </nav>

    <section class="home">
        <div class="text">Library</div>

        <!-- Tabs -->
        <div class="tabs">
            <!--<a href="library.html" class="tab-btn active">All Books</a>
            <a href="library.html?category=current" class="tab-btn">Currently Reading</a>
            <a href="library.html?category=want" class="tab-btn">Want to Read</a>
            <a href="library.html?category=finished" class="tab-btn">Finished</a>-->
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search books...">
            </div>
            <div class="toolbar-actions">

                <!--New tab-->
                <a href="addbook.html" target="_blank" class="btn btn-add" style="text-decoration: none;">

                    <!--Popup styles-->
                    <!--<a href="addbook.html" onclick="window.open('addbook.html', 'newwindow', 'width=600, height=400'); return false;" class="btn btn-add" style="text-decoration: none;">-->

                    <i class="fas fa-plus"></i>
                    Add Book
                </a>
            </div>
        </div>

        <!-- Book Grid -->
        <div class="books-grid">

            <!--<div class="book-card">
                <div class="book-cover">
                    <img src="https://images.unsplash.com/photo-1544947950-fa07a98d237f?q=80&w=400" alt="Book Cover">
                    <span class="badge badge-reading">Currently Reading</span>
                </div>
                <div class="book-info">
                    <h3 class="book-title">The Midnight Library</h3>
                    <p class="book-author">Matt Haig</p>
                    <div class="book-progress">
                        <div class="progress-bar" style="width: 65%;"></div>
                        <span class="progress-text">65% Read</span>
                    </div>
                </div>

            </div>-->

        </div>

    </section>

    <script src="library.js"></script>

</body>
</html>
